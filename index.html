*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--sans);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100vh}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
.app{max-width:760px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding:28px 24px calc(28px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:48px}
.brand{font-family:var(--serif);font-weight:500;letter-spacing:.32em;font-size:15px}
.brand small{font-family:var(--sans);letter-spacing:.04em;font-size:12px;color:var(--muted);margin-left:12px;font-weight:500}
.step{font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
main{flex:1;display:flex;flex-direction:column}
.foot{margin-top:56px;font-family:var(--serif);font-style:italic;color:var(--muted);font-size:13px;text-align:center;font-weight:300}
.screen{animation:in .45s cubic-bezier(.2,.7,.2,1)}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h1{font-family:var(--serif);font-weight:400;font-size:clamp(36px,7vw,56px);line-height:1.08;letter-spacing:-.015em;margin-bottom:20px}
h1 em{font-style:italic;color:var(--accent)}
h2{font-family:var(--serif);font-weight:400;font-size:clamp(26px,5vw,34px);line-height:1.15;margin-bottom:10px;letter-spacing:-.01em}
.lead{color:var(--muted);font-size:17px;max-width:540px}
.meta{display:flex;flex-wrap:wrap;gap:8px 22px;margin:28px 0 36px;font-size:14px;color:var(--muted)}
.meta b{color:var(--ink);font-weight:500}
.field{display:block;width:100%;max-width:360px;padding:14px 16px;border:1px solid var(--line);background:var(--paper);border-radius:12px;outline:none;transition:border-color .2s}
.field:focus{border-color:var(--accent)}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:14px 26px;border-radius:999px;background:var(--ink);color:var(--bg);font-weight:500;transition:transform .15s, opacity .2s}
.btn:hover{transform:translateY(-1px)}
.btn:disabled{opacity:.28;cursor:default;transform:none}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn .arr{font-family:var(--serif);font-size:18px;line-height:1}
.link{color:var(--muted);font-size:14px;padding:10px 4px;text-decoration:underline;text-underline-offset:4px;text-decoration-color:var(--line)}
.link:hover{color:var(--ink)}
.cards{display:grid;gap:10px;margin:28px 0 8px}
.card{text-align:left;padding:18px 20px;border:1px solid var(--line);border-radius:14px;background:var(--paper);transition:border-color .2s, background .2s;display:flex;gap:16px;align-items:baseline}

.opt.on{border-color:var(--accent);background:var(--soft)}

details{border-top:1px solid var(--line);padding-top:6px}
summary{cursor:pointer;padding:14px 0;font-weight:500;list-style:none;display:flex;justify-content:space-between}

.note{margin-top:32px;font-size:13px;color:var(--muted);max-width:560px}
.sent{font-size:13px;color:var(--accent);margin-top:14px}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

// Vocabulary size check: frequency bands (upper bound in words) and real words; pseudowords are traps
const VOCAB_BANDS = `
1000|house|water|money|friend|open|happy
2000|dangerous|weather|borrow|journey|quiet|invite
3000|ancient|rescue|bargain|scenery|rough|gather
5000|reluctant|fragile|vague|hazard|thrive|grim
8000|cumbersome|rampant|dwindle|candid|frugal|meander
12000|ubiquitous|quaint|garrulous|nonchalant|ostracize|insipid
20000|pusillanimous|obstreperous|lugubrious|perspicacious|susurrus|crepuscular
`;
const PSEUDOWORDS = `plound|brenish|mivoral|dremble|crontish|kleeve|contrimate|florsome|ostrabble|nalter|prendity|scrove|bludfast|fennicate`;


/* ===================== ENGINE ===================== */
const LEVELS = ['A1','A2','B1','B2','C1','C2'];
const CENTER = {A1:-2.5, A2:-1.5, B1:-0.5, B2:0.5, C1:1.5, C2:2.5};
const LEVEL_DESC = {
  A1:'Начальный уровень: базовые слова, простые фразы и конструкции.',
  A2:'Элементарный уровень: повседневные темы, основные времена.',
  B1:'Средний уровень: уверенно на знакомые темы, ключевые грамматические конструкции.',
  B2:'Выше среднего: свободное владение, сложные времена и устойчивые сочетания.',
  C1:'Продвинутый уровень: тонкости грамматики и богатый, точный словарь.',
  C2:'Владение в совершенстве: язык на уровне образованного носителя.'
};
const SELF = [
  ['Я только начинаю: знаю алфавит и несколько слов.', -2.8],
  ['Могу рассказать о себе, семье, покупках простыми фразами.', -1.6],
  ['Справляюсь в путешествии, понимаю основное в знакомых темах.', -0.5],
  ['Свободно общаюсь на большинство тем, смотрю сериалы с субтитрами.', 0.5],
  ['Читаю сложные тексты и говорю бегло и точно.', 1.5],
  ['Владею английским почти как родным.', 2.4]
];
const GRID = []; for (let t=-4.5; t<=4.5001; t+=0.05) GRID.push(+t.toFixed(2));

function parseBank(src){
  return src.split('\n').map(s=>s.trim()).filter(s=>s && !s.startsWith('#')).map(line=>{
    const f = line.split('|');
    const type = f[0], lvRaw = f[1];
    const lv = lvRaw.slice(0,2);
    const shift = lvRaw.endsWith('+') ? 0.33 : lvRaw.endsWith('-') ? -0.33 : 0;
    const it = {type, scale: type[0], level: lv, b: CENTER[lv] + shift, topic: f[2], prompt: f[3]};
    if (type === 'VT'){ it.answers = f[4].split('/').map(norm); it.c = 0; }
    else { it.correct = f[4]; it.distractors = f.slice(5); it.c = 0.2; }
    return it;
  });
}
function vType(topic){
  if (/word formation/.test(topic)) return 'formation';
  if (/phrasal/.test(topic)) return 'phrasal';
  if (/collocation|fixed phrases|prepositions/.test(topic)) return 'collocations';
  if (/idiom/.test(topic)) return 'idioms';
  if (/synonym|nuance|register/.test(topic)) return 'meaning';
  if (/confusing|-ed/.test(topic)) return 'confusing';
  return 'context';
}
const ITEMS = parseBank(GRAMMAR + '\n' + VOCAB).map((it,i)=>(it.id=i, it.vtype = it.scale==='V' ? vType(it.topic) : null, it));

function norm(s){ return String(s).toLowerCase().replace(/[’`]/g,"'").replace(/\s+/g,' ').trim(); }
const A = 1.7; // discrimination
function p3(theta, it){ return it.c + (1-it.c)/(1+Math.exp(-A*(theta-it.b))); }
function p1(theta, it){ return 1/(1+Math.exp(-A*(theta-it.b))); }
function info(theta, it){
  const P = p3(theta,it), c = it.c;
  return A*A*Math.pow(P-c,2)/Math.pow(1-c,2) * (1-P)/P;
}
function estimate(sc){
  const m = sc.prior.m, s = sc.prior.s;
  let w = GRID.map(t=>Math.exp(-0.5*Math.pow((t-m)/s,2)));
  for (const r of sc.resp){
    const it = ITEMS[r.id];
    w = w.map((x,k)=>{
      const t = GRID[k];
      if (r.dk) return x*(1-p1(t,it));
      const P = p3(t,it);
      return x*(r.ok ? P : 1-P);
    });
  }
  const sum = w.reduce((a,b)=>a+b,0);
  const mean = w.reduce((a,x,k)=>a+x*GRID[k],0)/sum;
  const v = w.reduce((a,x,k)=>a+x*Math.pow(GRID[k]-mean,2),0)/sum;
  sc.theta = mean; sc.se = Math.sqrt(v);
}
function scaleDone(sc){
  const n = sc.resp.length, L = CONFIG.limits[sc.key];
  return sc.exhausted || n >= L.max || (n >= L.min && sc.se < CONFIG.seTarget);
}
function pickItem(key){
  const sc = S.scales[key];
  const recent = sc.resp.slice(-2).map(r=>ITEMS[r.id].topic);
  let pool = ITEMS.filter(it=>it.scale===key && !S.used.has(it.id));
  const varied = pool.filter(it=>!recent.includes(it.topic));
  if (varied.length) pool = varied;
  pool = pool.map(it=>({it, i: info(sc.theta, it)})).sort((a,b)=>b.i-a.i);
  if (key === 'V'){
    // среди 8 самых информативных берём тип заданий, который встречался реже всего
    const top = pool.slice(0,8), used = {};
    sc.resp.forEach(r=>{ const t = ITEMS[r.id].vtype; used[t] = (used[t]||0)+1; });
    const least = Math.min(...top.map(x=>used[x.it.vtype]||0));
    pool = top.filter(x=>(used[x.it.vtype]||0) === least);
  } else pool = pool.slice(0,4);
  return pool.length ? pool[Math.floor(Math.random()*pool.length)].it : null;
}
function levelOf(theta){
  let idx = theta < -2 ? 0 : theta < -1 ? 1 : theta < 0 ? 2 : theta < 1 ? 3 : theta < 2 ? 4 : 5;
  const lo = [-3, -2, -1, 0, 1, 2][idx];
  const plus = idx < 5 && theta >= lo + 0.7;
  return {code: LEVELS[idx], label: LEVELS[idx] + (plus ? '+' : ''), idx};
}
function shuffle(a){ a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function esc(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* vocabulary size */
const BANDS = VOCAB_BANDS.trim().split('\n').map((l,i,arr)=>{
  const f = l.split('|'); const hi = +f[0];
  const lo = i ? +arr[i-1].split('|')[0] : 0;
  return {lo, hi, words: f.slice(1)};
});
const FAKES = PSEUDOWORDS.split('|');
function vocabSize(known){
  const fakeHits = FAKES.filter(w=>known.has(w)).length;
  const f = fakeHits / FAKES.length;
  let size = 0;
  for (const b of BANDS){
    const h = b.words.filter(w=>known.has(w)).length / b.words.length;
    const corr = f >= 1 ? 0 : Math.max(0, (h - f)/(1 - f));
    size += corr * (b.hi - b.lo);
  }
  return {size: Math.round(size/50)*50, falseRate: f, reliable: f <= 0.3};
}
function sizeToTheta(n){
  const pts = [[300,-3.3],[600,-2.5],[1500,-1.5],[2750,-0.5],[4000,0.5],[6000,1.5],[9500,2.5],[16000,3.2]];
  const x = Math.log(Math.max(n,100));
  if (x <= Math.log(pts[0][0])) return pts[0][1];
  for (let i=1;i<pts.length;i++){
    const x0=Math.log(pts[i-1][0]), x1=Math.log(pts[i][0]);
    if (x <= x1) return pts[i-1][1] + (pts[i][1]-pts[i-1][1])*(x-x0)/(x1-x0);
  }
  return pts[pts.length-1][1];
}

/* ===================== STATE ===================== */
let S;
function reset(){
  S = {
    screen:'intro', name:'', self:null,
    vc:{order: shuffle(BANDS.flatMap(b=>b.words).concat(FAKES)), page:0, known:new Set(), result:null},
    scales:{G:{key:'G',resp:[],prior:{m:0,s:1.2},theta:0,se:1.2}, V:{key:'V',resp:[],prior:{m:0,s:1.2},theta:0,se:1.2}},
    used:new Set(), turn:'G', cur:null, sel:null, typed:'', sent:false
  };
}
const VC_PER_PAGE = 14;

function vVocab(){
  const pages = Math.ceil(S.vc.order.length / VC_PER_PAGE);

function progress(){
  const mx = k => CONFIG.limits[k].max;
  const part = k => scaleDone(S.scales[k]) ? mx(k) : S.scales[k].resp.length;
  return Math.round((part('G') + part('V')) / (mx('G') + mx('V')) * 100);
}

function vQuestion(){
  const it = S.cur.it;
  const tag = it.scale === 'G' ? 'Грамматика' : 'Лексика';
  let prompt = it.prompt, kw = '';
  const m = prompt.match(/\(([A-Z]+)\)\s*$/);
  if (it.type === 'VT' && m){ kw = m[1]; prompt = prompt.replace(m[0], '').trim(); }
  const fill = it.type === 'VT' ? S.typed : (S.sel !== null ? S.cur.opts[S.sel] : '');
  const gapHtml = `<span class="gap${fill?' filled':''}">${fill ? esc(fill) : '&nbsp;'}</span>`;
  const q = esc(prompt).replace('___', gapHtml);
  let body;
  if (it.type === 'VT'){
    body = `<input class="field typed" id="typed" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Впишите слово" value="${esc(S.typed)}">
            <p class="hint" style="margin-top:10px">Образуйте нужную форму от слова <b>${esc(kw)}</b>.</p>`;
  } else {
    const long = S.cur.opts.some(o=>o.length > 26);
    body = `<div class="opts${long?' one':''}">${S.cur.opts.map((o,i)=>`<button class="opt${S.sel===i?' on':''}" data-act="opt" data-i="${i}"><span class="k">${i+1}</span><span>${o==='—'?'— <span class="hint">(без артикля)</span>':esc(o)}</span></button>`).join('')}</div>`;
  }
  const ready = it.type === 'VT' ? S.typed.trim().length > 0 : S.sel !== null;
  render(`
    <div class="bar"><i style="width:${progress()}%"></i></div>
    <span class="tag">${tag}</span>
    <p class="q">${q}</p>
    ${body}
    <div class="actions">
      <button class="link" data-act="dk">Не знаю</button>
      <button class="btn" data-act="answer" id="answerBtn" ${ready?'':'disabled'}>Дальше <span class="arr">→</span></button>
    </div>
  `, 'Шаг 3 из 3');
  const inp = document.getElementById('typed');
  if (inp){ inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
}

function selectOpt(i){
  S.sel = i;
  view.querySelectorAll('.opt').forEach((o,k)=>o.classList.toggle('on', k===i));
  const gap = view.querySelector('.gap'); if (gap){ gap.textContent = S.cur.opts[i] === '—' ? '—' : S.cur.opts[i]; gap.classList.add('filled'); }
  const btn = document.getElementById('answerBtn'); if (btn) btn.disabled = false;
}

function computeResult(){
  const G = S.scales.G, V = S.scales.V;
  const theta = (G.theta + V.theta)/2;
  const se = Math.sqrt(G.se*G.se + V.se*V.se)/2;
  const wrong = [];
  for (const k of ['G','V']) for (const r of S.scales[k].resp) if (!r.ok) wrong.push(r);
  const topics = {};
  wrong.forEach(r=>{ const it = ITEMS[r.id]; const key = it.topic; if (!topics[key] || it.b < topics[key].b) topics[key] = {topic: key, level: it.level, b: it.b, scale: it.scale}; });
  return {
    overall: levelOf(theta), theta, se,
    g: levelOf(G.theta), gTheta: G.theta, gSe: G.se, gRange: [levelOf(G.theta - G.se).label, levelOf(G.theta + G.se).label],
    v: levelOf(V.theta), vTheta: V.theta, vSe: V.se, vRange: [levelOf(V.theta - V.se).label, levelOf(V.theta + V.se).label],
    size: S.vc.result,
    topics: Object.values(topics).filter(t=>t.b <= theta + 0.6).sort((a,b)=>a.b-b.b).slice(0,10),
    answered: G.resp.length + V.resp.length,
    correct: G.resp.filter(r=>r.ok).length + V.resp.filter(r=>r.ok).length
  };
}
function pos(theta){ return Math.max(2, Math.min(98, (theta + 3) / 6 * 100)); }

function vResults(){
  const R = computeResult();
  S.result = R;
  const all = [...S.scales.G.resp, ...S.scales.V.resp];
  const reviewItems = all.map(r=>{
    const it = ITEMS[r.id];
    const right = it.type === 'VT' ? it.answers[0] : it.correct;
    const shown = esc(it.prompt).replace('___', '<span class="gap filled">'+esc(right)+'</span>');
    const yours = r.dk ? 'не знаю' : r.given;
    return `<div class="rev"><div class="l">${it.scale==='G'?'Грамматика':'Лексика'} · ${it.level} · ${esc(it.topic)}</div>
      <div class="p">${shown}</div>
      <div class="a">${r.ok ? '<b>Верно</b>' : 'Ваш ответ: <s>'+esc(yours)+'</s> · правильно: <b>'+esc(right)+'</b>'}</div></div>`;
  }).join('');
  const sizeBlock = R.size ? `<div class="stat"><div class="over">Словарный запас</div><div class="v">${R.size.size < 500 ? '< 500' : '≈ ' + R.size.size.toLocaleString('ru-RU')}</div><div class="s">${R.size.reliable ? 'слов (оценка по частотности)' : 'много отмеченных выдуманных слов — оценка неточна'}</div></div>` : '';
  render(`
    <div class="over">Ваш уровень${S.name?' · '+esc(S.name):''}</div>
    <div class="lvl">${R.overall.label}</div>
    <p class="desc">${LEVEL_DESC[R.overall.code]}</p>

    <div class="scale" aria-hidden="true">
      <div class="track">${LEVELS.map(l=>`<span>${l}</span>`).join('')}</div>
      <div class="pin g" style="left:${pos(R.gTheta)}%"></div>
      <div class="pin v" style="left:${pos(R.vTheta)}%${Math.abs(pos(R.gTheta)-pos(R.vTheta))<2?';top:-18px':''}"></div>
    </div>
    <div class="legend"><span><i style="background:var(--ink)"></i>Грамматика</span><span><i style="background:var(--accent)"></i>Лексика</span></div>

    <div class="${sizeBlock?'grid3':'grid2'}">
      <div class="stat"><div class="over">Грамматика</div><div class="v">${R.g.label}</div><div class="s">диапазон ${R.gRange[0]===R.gRange[1]?R.gRange[0]:R.gRange[0]+' – '+R.gRange[1]}</div></div>
      <div class="stat"><div class="over">Лексика</div><div class="v">${R.v.label}</div><div class="s">диапазон ${R.vRange[0]===R.vRange[1]?R.vRange[0]:R.vRange[0]+' – '+R.vRange[1]}</div></div>
      ${sizeBlock}
    </div>

    ${R.topics.length ? `<div class="sect"><h3>Что стоит повторить</h3><div class="topics">${R.topics.map(t=>`<span class="topic"><b>${t.level}</b>${esc(t.topic)}</span>`).join('')}</div></div>` : ''}

    <div class="sect">
      <details><summary>Разбор ответов · ${R.correct} из ${R.answered}</summary>${reviewItems}</details>
    </div>

    <div class="row" style="margin-top:36px">
      <button class="btn" data-act="copy">Скопировать результат</button>
      <button class="btn ghost" data-act="restart">Пройти заново</button>
    </div>
    <p class="sent" id="sent"></p>
    <p class="note">Тест оценивает грамматику и лексику. Аудирование, чтение, письмо и говорение он не проверяет.</p>
  `, 'Результат');
  sendToBilly(R);
}

/* ===================== FLOW ===================== */
function startTest(){
  const selfTheta = SELF[S.self][1];
  const r = vocabSize(S.vc.known);
  S.vc.result = r;
  S.scales.G.prior = {m: selfTheta, s: 1.5};
  S.scales.V.prior = r.reliable ? {m: (selfTheta + sizeToTheta(r.size))/2, s: 1.4} : {m: selfTheta, s: 1.5};
  estimate(S.scales.G); estimate(S.scales.V);
  S.screen = 'test';
  next();
}
function next(){
  const gDone = scaleDone(S.scales.G), vDone = scaleDone(S.scales.V);
  if (gDone && vDone){ S.screen = 'results'; vResults(); return; }
  let key = S.turn;
  if (scaleDone(S.scales[key])) key = key === 'G' ? 'V' : 'G';
  const it = pickItem(key);
  if (!it){ S.scales[key].exhausted = true; return next(); }
  S.turn = key === 'G' ? 'V' : 'G';
  S.used.add(it.id);
  S.cur = {it, opts: it.type === 'VT' ? null : shuffle([it.correct, ...it.distractors])};
  S.sel = null; S.typed = '';
  vQuestion();
}
function submit(dk){
  const it = S.cur.it, sc = S.scales[it.scale];
  let ok = false, given = '';
  if (!dk){
    if (it.type === 'VT'){ given = S.typed.trim(); ok = it.answers.includes(norm(given)); }
    else { given = S.cur.opts[S.sel]; ok = given === it.correct; }
  }
  sc.resp.push({id: it.id, ok, dk: !!dk, given});
  estimate(sc);
  next();
}

function summaryText(R){
  const lines = [
    'NOEON · Level Test',
    S.name ? 'Имя: ' + S.name : null,
    'Общий уровень: ' + R.overall.label,
    'Грамматика: ' + R.g.label + ' (θ ' + R.gTheta.toFixed(2) + ' ± ' + R.gSe.toFixed(2) + ')',
    'Лексика: ' + R.v.label + ' (θ ' + R.vTheta.toFixed(2) + ' ± ' + R.vSe.toFixed(2) + ')',
    R.size ? 'Словарный запас: ' + (R.size.size < 500 ? '< 500' : '≈ ' + R.size.size) + (R.size.reliable ? '' : ' (ненадёжно: ' + Math.round(R.size.falseRate*100) + '% выдуманных слов)') : null,
    'Верных ответов: ' + R.correct + ' из ' + R.answered,
    R.topics.length ? 'Повторить: ' + R.topics.map(t=>t.level + ' ' + t.topic).join('; ') : null
  ];
  return lines.filter(Boolean).join('\n');
}
function sendToBilly(R){
  if (S.sent || !CONFIG.telegramToken || !CONFIG.telegramChatId) return;
  S.sent = true;
  const body = new URLSearchParams({chat_id: CONFIG.telegramChatId, text: summaryText(R)});
  fetch('https://api.telegram.org/bot' + CONFIG.telegramToken + '/sendMessage', {method:'POST', mode:'no-cors', body})
    .then(()=>{ const el = document.getElementById('sent'); if (el) el.textContent = 'Результат отправлен преподавателю.'; })
    .catch(()=>{});
}
function copyText(text, btn){
  const done = () => { btn.textContent = 'Скопировано'; setTimeout(()=>{ btn.textContent = 'Скопировать результат'; }, 1800); };
  if (navigator.clipboard && window.isSecureContext){ navigator.clipboard.writeText(text).then(done).catch(fallback); }
  else fallback();
  function fallback(){
    const ta = document.createElement('textarea'); ta.value = text; ta.className = 'visually-hidden';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); done(); } catch(e){}
    ta.remove();
  }
}

/* ===================== EVENTS (delegation) ===================== */
view.addEventListener('click', e=>{
  const t = e.target.closest('[data-act]'); if (!t || t.disabled) return;
  const act = t.dataset.act;
  if (act === 'start'){ const n = document.getElementById('name'); S.name = n ? n.value.trim() : ''; S.screen = 'self'; vSelf(); }
  else if (act === 'self'){ S.self = +t.dataset.i; view.querySelectorAll('.card').forEach((c,i)=>c.classList.toggle('on', i===S.self)); view.querySelector('[data-act="self-next"]').disabled = false; }
  else if (act === 'self-next'){ S.screen = 'vocab'; vVocab(); }
  else if (act === 'word'){ const w = t.dataset.w; S.vc.known.has(w) ? S.vc.known.delete(w) : S.vc.known.add(w); t.classList.toggle('on'); t.setAttribute('aria-pressed', S.vc.known.has(w)); }
  else if (act === 'vocab-next'){
    const pages = Math.ceil(S.vc.order.length / VC_PER_PAGE);
    if (S.vc.page + 1 < pages){ S.vc.page++; vVocab(); } else startTest();
  }
  else if (act === 'opt') selectOpt(+t.dataset.i);
  else if (act === 'answer') submit(false);
  else if (act === 'dk') submit(true);
  else if (act === 'copy') copyText(summaryText(S.result), t);
  else if (act === 'restart'){ const n = S.name; reset(); S.name = n; vIntro(); }
});
view.addEventListener('input', e=>{
  if (e.target.id === 'typed'){
    S.typed = e.target.value;
    const gap = view.querySelector('.gap');
    if (gap){ gap.textContent = S.typed || ' '; gap.classList.toggle('filled', !!S.typed); }
    const btn = document.getElementById('answerBtn'); if (btn) btn.disabled = !S.typed.trim();
  } else if (e.target.id === 'name'){ S.name = e.target.value; }
});
document.addEventListener('keydown', e=>{
  if (S.screen === 'test' && S.cur){
    if (S.cur.it.type !== 'VT' && /^[1-4]$/.test(e.key)) selectOpt(+e.key - 1);
    else if (e.key === 'Enter'){ const b = document.getElementById('answerBtn'); if (b && !b.disabled){ e.preventDefault(); submit(false); } }
  } else if (e.key === 'Enter'){
    const b = view.querySelector('.btn:not([disabled])'); if (b && S.screen !== 'results'){ e.preventDefault(); b.click(); }
  }
});

reset(); vIntro();
window.__LT = {get S(){return S}, ITEMS, estimate, levelOf, vocabSize, sizeToTheta, CONFIG};
</script>
